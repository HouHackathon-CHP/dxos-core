name: Verify core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r gateway/requirements.txt -r data/requirements.txt -r workflow/requirements.txt pytest
      - name: Check direct dependency licenses
        run: python scripts/check_direct_licenses.py
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Run tests
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start local core
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Exercise core APIs
        run: python scripts/smoke.py
      - name: Show service status after failure
        if: failure()
        run: docker compose ps
      - name: Stop local core
        if: always()
        run: docker compose down --volumes

